名字: 内核构建CI

在:
  workflow_dispatch:

工作:
建筑:
    runs-on: ubuntu-latest
容器:
图像: ghcr.io/jiu-xiao/kernel-docker:主要的

步骤:
    - 用途: actions/checkout@v3
    - 名字: 创建狗屎dir
跑: mkdir驱动程序/输入/触摸屏/focaltech_3658u/include&&mkdir驱动程序/输入/触摸屏/focaltech_touch/include

    - 名字: 改变全部容量
跑: sed -i'736s/.*/ *nom_cap_uah = ${{ vars.capacity }} *1000;/' drivers/power/supply/qcom/qpnp-fg-gen4.c


    - 名字: 改变设计
跑: sed -i'28s/.*/ qcom,nom-batt-capacity-mah = < ${{ vars.capacity }} >;/' arch/arm64/boot/dts/vendor/qcom/fg-gen4-batterydata-alioth-FMT-4520mah.dtsi


    - 名字: 预
跑: bash compile.sh
    - 名字: 建筑
跑: bash编译-alioth. sh
    - 名字: 封装内核
跑: cp $GITHUB_WORKSPACE/out/outputs/alioth/Image.gz ./F3-NoGravityKernel-1.5.0/ && cp out/outputs/alioth/dtb ./F3-NoGravityKernel-1.5.0/ && cp out/outputs/alioth/alioth_dtbo-miui.img ./F3-NoGravityKernel-1.5.0/ && mv ./F3-NoGravityKernel-1.5.0/alioth_dtbo-miui.img ./F3-NoGravityKernel-1.5.0/dtbo.img && cd F3-NoGravityKernel-1.5.0 && zip -r alioth-${{ vars.capacity }}.zip ./*

    - 名字: 创建发布
跑: 回声"release_name=$（日期+v%Y.%M.%d.vv%H.%M）">> $GITHUB_ENV

    - 用途: actions/create-release@v1
身份证: create_release
env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
与:
          tag_name: ${{ env.release_name }}
          release_name: 释放${{ env.release_name }}
草案: 虚假的
预释放: 虚假的

    - 名字: 上传内核
用途: actions/upload-release-asset@v1
身份证: upload-kernel
env:
        GITHUB_TOKEN: ${{ github.token }}
与:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{github.workspace}}/F3-NoGravityKernel-1.5.0/alioth-${{ vars.capacity }}.zip
        asset_name: alioth-${{ vars.capacity }}.zip
        asset_content_type: application/zip
